name: Build Python from the checked-out Alpine base
description: Validate the Python image without pulling or publishing the fork's images

inputs:
  alpine-version:
    description: Official Alpine tag used by the base Dockerfile
    required: true
  context:
    description: Python build context
    required: true
  arch:
    description: Home Assistant architecture name
    required: true
  platform:
    description: Docker build platform
    required: true
  version:
    description: Build version
    required: true
  cache-scope:
    description: GitHub Actions cache scope, empty to disable caching
    required: false
    default: ""
  emulated:
    description: Whether Python is compiled under CPU emulation
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build Alpine and Python together
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
      with:
        source: .
        files: .github/actions/build-python-local/docker-bake.hcl
        targets: python
        pull: true
        set: |
          *.platform=${{ inputs.platform }}
          alpine.args.ALPINE_VERSION=${{ inputs.alpine-version }}
          python.context=${{ inputs.context }}
          python.args.BUILD_ARCH=${{ inputs.arch }}
          python.args.BUILD_VERSION=${{ inputs.version }}
          ${{ inputs.emulated == 'true' && 'python.args.PYTHON_OPTIMIZATIONS=' || '' }}
          ${{ inputs.cache-scope != '' && format('python.cache-from=type=gha,scope={0}', inputs.cache-scope) || '' }}
          ${{ inputs.cache-scope != '' && format('python.cache-to=type=gha,mode=max,scope={0}', inputs.cache-scope) || '' }}
