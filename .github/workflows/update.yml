name: Sync upstream and update pins

# Keeps the fork current in two steps:
#   1. Merge the selected stable release tag from home-assistant/docker-base.
#   2. Pin the newest Alpine, Debian, Ubuntu and Python releases in versions.json.
# Dispatch a build on the matching fork tag for each new upstream release.
#
# Pushing changes to .github/workflows needs a token with the "workflow" scope.
# Add it as the repository secret SYNC_TOKEN, the default token cannot do that.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: write # Start the publishing build
      contents: write # Push the merge and the new pins
      issues: write # Report merges that need a human
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Select the next stable upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          filter='.[] | select((.draft or .prerelease) | not) | .tag_name | select(test("^[0-9]{4}\\.[0-9]{2}\\.[0-9]+$"))'
          upstream="$(gh api --paginate repos/home-assistant/docker-base/releases --jq "${filter}" | sort -Vu)"
          published="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq "${filter}" | sort -Vu)"
          if [[ -z "${upstream}" ]]; then
            echo "::error::No stable docker-base releases found"
            exit 1
          fi

          latest="$(tail -n 1 <<< "${published}")"
          if [[ -n "${latest}" ]]; then
            # Process releases in order, even if several appeared between polls.
            next="$(printf '%s\n%s\n' "${latest}" "${upstream}" | sort -Vu |
              awk -v latest="${latest}" '$0 == latest { seen = 1; next } seen && !emitted { print; emitted = 1 }')"
          else
            # Bootstrap at the latest upstream release, or retry the pinned first release.
            tags="$(git tag --sort=version:refname)"
            pending=""
            while IFS= read -r tag; do
              if grep -Fxq "${tag}" <<< "${upstream}"; then
                pending="${tag}"
                break
              fi
            done <<< "${tags}"
            next="${pending:-$(tail -n 1 <<< "${upstream}")}"
          fi

          echo "target=${next:-${latest}}" >> "${GITHUB_OUTPUT}"
          echo "pending=${next}" >> "${GITHUB_OUTPUT}"

      - name: Merge upstream
        id: sync
        env:
          UPSTREAM_RELEASE: ${{ steps.release.outputs.target }}
        run: |
          before="$(git rev-parse HEAD)"
          echo "before=${before}" >> "${GITHUB_OUTPUT}"
          status=0
          scripts/sync-upstream.sh || status=$?
          echo "conflict=$([[ ${status} -eq 2 ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
          if [[ ${status} -ne 0 && ${status} -ne 2 ]]; then
            exit "${status}"
          fi

      - name: Pin current releases
        if: steps.sync.outputs.conflict != 'true'
        run: |
          python3 -I scripts/resolve_versions.py
          if [[ -n "$(git status --porcelain)" ]]; then
            git add --all
            git commit --quiet -m "Update pinned release versions"
          fi

      - name: Push changes
        id: push
        if: steps.sync.outputs.conflict != 'true'
        env:
          BEFORE: ${{ steps.sync.outputs.before }}
        run: |
          after="$(git rev-parse HEAD)"
          if [[ "${BEFORE}" == "${after}" ]]; then
            echo "Nothing to push"
            echo "images_changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git push origin HEAD
          if git diff --name-only "${BEFORE}" "${after}" | grep -qE '^(alpine|debian|ubuntu|python)/|^versions\.json$'; then
            echo "images_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "images_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish new images
        if: steps.release.outputs.pending == '' && steps.push.outputs.images_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run builder.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" -f publish=true

      - name: Build the pending upstream release
        if: steps.sync.outputs.conflict != 'true' && steps.release.outputs.pending != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.pending }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE}"; then
            git tag "${RELEASE}"
            git push origin "refs/tags/${RELEASE}"
          fi
          git merge-base --is-ancestor "refs/upstream/releases/${RELEASE}" "refs/tags/${RELEASE}"

          active="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/builder.yml/runs" \
            -f branch="${RELEASE}" -f event=workflow_dispatch \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [[ "${active}" == 0 ]]; then
            gh workflow run builder.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE}" -f publish=true -f release_tag="${RELEASE}"
          else
            echo "The build for ${RELEASE} is already pending"
          fi

      - name: Report merge conflicts
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync needs manual merge"
          if [[ -z "$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${title} in:title" --json number --jq '.[].number')" ]]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "The automatic merge of home-assistant/docker-base failed. See the [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for the release tag and conflicting files."
          fi
          exit 1
