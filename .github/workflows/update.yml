name: Sync upstream and update pins

# Keeps the fork current in two steps:
#   1. Merge home-assistant/docker-base (new Home Assistant component versions,
#      Python releases, patches).
#   2. Pin the newest Alpine, Debian, Ubuntu and Python releases in versions.json.
# When something that affects the images changed, a publishing build is started.
#
# Pushing changes to .github/workflows needs a token with the "workflow" scope.
# Add it as the repository secret SYNC_TOKEN, the default token cannot do that.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    permissions:
      actions: write # Start the publishing build
      contents: write # Push the merge and the new pins
      issues: write # Report merges that need a human
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream
        id: sync
        run: |
          before="$(git rev-parse HEAD)"
          echo "before=${before}" >> "${GITHUB_OUTPUT}"
          status=0
          scripts/sync-upstream.sh || status=$?
          echo "conflict=$([[ ${status} -eq 2 ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
          if [[ ${status} -ne 0 && ${status} -ne 2 ]]; then
            exit "${status}"
          fi

      - name: Pin current releases
        if: steps.sync.outputs.conflict != 'true'
        run: |
          python3 -I scripts/resolve_versions.py
          if [[ -n "$(git status --porcelain)" ]]; then
            git add --all
            git commit --quiet -m "Update pinned release versions"
          fi

      - name: Push changes
        id: push
        if: steps.sync.outputs.conflict != 'true'
        env:
          BEFORE: ${{ steps.sync.outputs.before }}
        run: |
          after="$(git rev-parse HEAD)"
          if [[ "${BEFORE}" == "${after}" ]]; then
            echo "Nothing to push"
            echo "images_changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git push origin HEAD
          if git diff --name-only "${BEFORE}" "${after}" | grep -qE '^(alpine|debian|ubuntu|python)/|^versions\.json$'; then
            echo "images_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "images_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish new images
        if: steps.push.outputs.images_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run builder.yml --ref "${GITHUB_REF_NAME}" -f publish=true

      - name: Report merge conflicts
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream sync needs manual merge"
          if [[ -z "$(gh issue list --state open --search "${title} in:title" --json number --jq '.[].number')" ]]; then
            gh issue create --title "${title}" --body "The automatic merge of home-assistant/docker-base failed, see the [workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for the conflicting files. Merge \`upstream/master\` manually and resolve them."
          fi
          exit 1
