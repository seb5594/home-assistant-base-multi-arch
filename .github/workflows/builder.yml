name: Build base images

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  release:
    types: ["published"]
  schedule:
    # Weekly rebuild: picks up OS security updates and refreshes the dev images
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the built images to GitHub Container Registry
        type: boolean
        default: false

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      push: ${{ steps.meta.outputs.push }}
      alpine_matrix: ${{ steps.matrices.outputs.alpine }}
      debian_matrix: ${{ steps.matrices.outputs.debian }}
      ubuntu_matrix: ${{ steps.matrices.outputs.ubuntu }}
      python_matrix: ${{ steps.matrices.outputs.python }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set build metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # fast: only stable releases on the architectures that build quickly. Used for
          # pushes and pull requests, the slow emulated builds run on schedule and release.
          case "${EVENT_NAME}" in
            release)
              version="${RELEASE_TAG}"
              push=true
              fast=false
              ;;
            schedule)
              version="$(date -u +%Y.%m.%d).${RUN_NUMBER}"
              push=true
              fast=false
              ;;
            workflow_dispatch)
              version="$(date -u +%Y.%m.%d).${RUN_NUMBER}"
              push="${PUBLISH}"
              fast=false
              ;;
            *)
              version="${GITHUB_SHA::7}"
              push=false
              fast=true
              ;;
          esac

          {
            echo "version=${version}"
            echo "push=${push}"
            echo "fast=${fast}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create build matrices from versions.json
        id: matrices
        shell: bash
        env:
          FAST: ${{ steps.meta.outputs.fast }}
        run: |
          jq -c --argjson fast "${FAST}" '
            ["amd64", "aarch64", "i386"] as $fast_architectures

            | def prepare:
                map(select((.dev | not) or ($fast | not)))
                | map(.tag = (if .dev then "dev" else .version end))
                | map(
                    if $fast
                    then .architectures |= map(select(. as $arch | $fast_architectures | index($arch) != null))
                    else .
                    end
                  );

            def stringify_architectures:
              map(.architectures |= tojson);

            (.alpine | prepare) as $alpine
            | {
                alpine: {include: ($alpine | stringify_architectures)},
                debian: {include: (.debian | prepare | stringify_architectures)},
                ubuntu: {include: (.ubuntu | prepare | stringify_architectures)},
                python: {include: [
                  .python[] as $python
                  | $alpine[]
                  | {
                      python_version: $python.version,
                      alpine_version: .version,
                      dev: .dev,
                      tag: (
                        if .dev
                        then "\($python.version)-dev"
                        else "\($python.version)-alpine\(.version)"
                        end
                      ),
                      latest: (.latest and $python.latest),
                      architectures: (.architectures | tojson)
                    }
                ]}
              }
          ' versions.json > matrices.json

          for family in alpine debian ubuntu python; do
            echo "${family}=$(jq -c ".${family}" matrices.json)" >> "${GITHUB_OUTPUT}"
          done

  build_alpine:
    name: Alpine ${{ matrix.version }}
    needs: init
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.alpine_matrix) }}
    permissions:
      contents: read
      id-token: write # For cosign signing
      packages: write # For pushing to registry
    uses: ./.github/workflows/build-base-image.yml
    with:
      architectures: ${{ matrix.architectures }}
      build-args: |
        ALPINE_VERSION=${{ matrix.version }}
      cache-gha-scope: alpine-${{ matrix.version }}
      cache-image-tag: ${{ matrix.tag }}
      context: alpine
      image-name: base
      image-tags: |
        ${{ matrix.tag }}
        ${{ matrix.tag }}-${{ needs.init.outputs.version }}
        ${{ matrix.latest && 'latest' || '' }}
      labels: |
        io.hass.base.image=alpine:${{ matrix.version }}
      push: ${{ needs.init.outputs.push == 'true' }}
      version: ${{ needs.init.outputs.version }}

  build_debian:
    name: Debian ${{ matrix.version }}
    needs: init
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.debian_matrix) }}
    permissions:
      contents: read
      id-token: write # For cosign signing
      packages: write # For pushing to registry
    uses: ./.github/workflows/build-base-image.yml
    with:
      architectures: ${{ matrix.architectures }}
      build-args: |
        DEBIAN_VERSION=${{ matrix.version }}
      cache-gha-scope: debian-${{ matrix.version }}
      cache-image-tag: ${{ matrix.tag }}
      context: debian
      image-name: base-debian
      image-tags: |
        ${{ matrix.tag }}
        ${{ matrix.tag }}-${{ needs.init.outputs.version }}
        ${{ matrix.latest && 'latest' || '' }}
      labels: |
        io.hass.base.image=debian:${{ matrix.version }}-slim
      push: ${{ needs.init.outputs.push == 'true' }}
      version: ${{ needs.init.outputs.version }}

  build_ubuntu:
    name: Ubuntu ${{ matrix.version }}
    needs: init
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.ubuntu_matrix) }}
    permissions:
      contents: read
      id-token: write # For cosign signing
      packages: write # For pushing to registry
    uses: ./.github/workflows/build-base-image.yml
    with:
      architectures: ${{ matrix.architectures }}
      build-args: |
        UBUNTU_VERSION=${{ matrix.version }}
      cache-gha-scope: ubuntu-${{ matrix.version }}
      cache-image-tag: ${{ matrix.tag }}
      context: ubuntu
      image-name: base-ubuntu
      image-tags: |
        ${{ matrix.tag }}
        ${{ matrix.tag }}-${{ needs.init.outputs.version }}
        ${{ matrix.latest && 'latest' || '' }}
      labels: |
        io.hass.base.image=ubuntu:${{ matrix.version }}
      push: ${{ needs.init.outputs.push == 'true' }}
      version: ${{ needs.init.outputs.version }}

  build_python:
    name: Python ${{ matrix.python_version }} (Alpine ${{ matrix.alpine_version }})
    needs: [init, build_alpine]
    # A failing dev build must not block the Python images of the stable releases.
    if: ${{ !cancelled() && needs.init.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.python_matrix) }}
    permissions:
      contents: read
      id-token: write # For cosign signing
      packages: write # For pushing to registry
    uses: ./.github/workflows/build-base-image.yml
    with:
      architectures: ${{ matrix.architectures }}
      build-args: |
        BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/base
        BASE_VERSION=${{ matrix.alpine_version }}
      cache-gha-scope: python-${{ matrix.python_version }}-alpine${{ matrix.alpine_version }}
      cache-image-tag: ${{ matrix.tag }}
      context: python/${{ matrix.python_version }}
      cosign-base-identity: "https://github.com/${{ github.repository }}/.*"
      cosign-base-verify: ghcr.io/${{ github.repository_owner }}/base:${{ matrix.alpine_version }}
      # Profile-guided and link-time optimization take hours under CPU emulation
      emulated-build-args: |
        PYTHON_OPTIMIZATIONS=
      image-name: base-python
      image-tags: |
        ${{ matrix.tag }}
        ${{ matrix.tag }}-${{ needs.init.outputs.version }}
        ${{ matrix.latest && 'latest' || '' }}
      labels: |
        io.hass.base.image=ghcr.io/${{ github.repository_owner }}/base:${{ matrix.alpine_version }}
      push: ${{ needs.init.outputs.push == 'true' }}
      version: ${{ needs.init.outputs.version }}
