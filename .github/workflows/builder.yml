name: Build base images

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  release:
    types: ["published"]
  schedule:
    # Weekly rebuild: picks up OS security updates and refreshes the dev images
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the built images to GitHub Container Registry
        type: boolean
        default: false
      release_tag:
        description: Publish the matching stable docker-base release from its fork tag
        type: string
        default: ""

concurrency:
  group: ${{ (github.event_name == 'release' || github.event_name == 'schedule' || inputs.publish) && 'publish-base-images' || format('build-base-images-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      push: ${{ steps.meta.outputs.push }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_suffix: ${{ steps.meta.outputs.release_suffix }}
      alpine_matrix: ${{ steps.matrices.outputs.alpine }}
      debian_matrix: ${{ steps.matrices.outputs.debian }}
      ubuntu_matrix: ${{ steps.matrices.outputs.ubuntu }}
      python_matrix: ${{ steps.matrices.outputs.python }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set build metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          REQUESTED_RELEASE: ${{ inputs.release_tag }}
          PUBLISHED_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          release_tag=""
          # fast: only stable releases on the architectures that build quickly. Used for
          # pushes and pull requests, the slow emulated builds run on schedule and release.
          case "${EVENT_NAME}" in
            release)
              release_tag="${PUBLISHED_RELEASE}"
              push=true
              fast=false
              ;;
            schedule)
              push=true
              fast=false
              ;;
            workflow_dispatch)
              push="${PUBLISH}"
              fast=false
              release_tag="${REQUESTED_RELEASE}"
              ;;
            *)
              push=false
              fast=true
              ;;
          esac
          version="${GITHUB_SHA::7}"
          suffix=""
          if [[ -n "${release_tag}" ]]; then
            if [[ ! "${release_tag}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ||
                  "${GITHUB_REF}" != "refs/tags/${release_tag}" || "${push}" != true ]]; then
              echo "::error::Release builds must publish from the matching stable release tag"
              exit 1
            fi
            version="${release_tag}"
            suffix="-${release_tag}"
          fi

          {
            echo "version=${version}"
            echo "push=${push}"
            echo "fast=${fast}"
            echo "release_tag=${release_tag}"
            echo "release_suffix=${suffix}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create build matrices from versions.json
        id: matrices
        shell: bash
        env:
          FAST: ${{ steps.meta.outputs.fast }}
        run: |
          jq -c --argjson fast "${FAST}" '
            ["amd64", "aarch64", "i386"] as $fast_architectures

            | def prepare:
                map(select((.dev | not) or ($fast | not)))
                | map(.tag = (if .dev then "dev" else .version end))
                | map(
                    if $fast
                    then .architectures |= map(select(. as $arch | $fast_architectures | index($arch) != null))
                    else .
                    end
                  );

            def stringify_architectures:
              map(.architectures |= tojson);

            (.alpine | prepare) as $alpine
            | (.python | max_by(.version | split(".") | map(tonumber)) | .version) as $newest_python
            | {
                alpine: {include: ($alpine | stringify_architectures)},
                debian: {include: (.debian | prepare | stringify_architectures)},
                ubuntu: {include: (.ubuntu | prepare | stringify_architectures)},
                python: {include: [
                  .python[] as $python
                  | $alpine[]
                  | select((.dev | not) or $python.version == $newest_python)
                  | {
                      python_version: $python.version,
                      alpine_version: .version,
                      alpine_tag: .tag,
                      dev: .dev,
                      tag: (
                        if .dev
                        then "\($python.version)-dev"
                        else "\($python.version)-alpine\(.version)"
                        end
                      ),
                      latest: (.latest and $python.latest),
                      architectures: (.architectures | tojson)
                    }
                ]}
              }
          ' versions.json > matrices.json

          for family in alpine debian ubuntu python; do
            echo "${family}=$(jq -c ".${family}" matrices.json)" >> "${GITHUB_OUTPUT}"
          done

  build_alpine:
    name: Alpine ${{ matrix.version }}
    needs: init
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.alpine_matrix) }}
    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write # For pushing to registry
    uses: ./.github/workflows/build-base-image.yml
    with:
      architectures: ${{ matrix.architectures }}
      build-args: |
        ALPINE_VERSION=${{ matrix.version }}
      cache-gha-scope: alpine-${{ matrix.version }}
      context: alpine
      image-name: home-assistant-base
      image-tags: |
        ${{ needs.init.outputs.release_suffix && format('{0}{1}', matrix.tag, needs.init.outputs.release_suffix) || '' }}
        ${{ matrix.tag }}
        ${{ matrix.latest && 'latest' || '' }}
      labels: |
        io.hass.base.image=alpine:${{ matrix.version }}
      push: ${{ needs.init.outputs.push == 'true' }}
      version: ${{ needs.init.outputs.version }}

  build_debian:
    name: Debian ${{ matrix.version }}
    needs: init
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.debian_matrix) }}
    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write # For pushing to registry
    uses: ./.github/workflows/build-base-image.yml
    with:
      architectures: ${{ matrix.architectures }}
      build-args: |
        DEBIAN_VERSION=${{ matrix.version }}
      cache-gha-scope: debian-${{ matrix.version }}
      context: debian
      image-name: home-assistant-base-debian
      image-tags: |
        ${{ needs.init.outputs.release_suffix && format('{0}{1}', matrix.tag, needs.init.outputs.release_suffix) || '' }}
        ${{ matrix.tag }}
        ${{ matrix.latest && 'latest' || '' }}
      labels: |
        io.hass.base.image=debian:${{ matrix.version }}-slim
      push: ${{ needs.init.outputs.push == 'true' }}
      version: ${{ needs.init.outputs.version }}

  build_ubuntu:
    name: Ubuntu ${{ matrix.version }}
    needs: init
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.ubuntu_matrix) }}
    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write # For pushing to registry
    uses: ./.github/workflows/build-base-image.yml
    with:
      architectures: ${{ matrix.architectures }}
      build-args: |
        UBUNTU_VERSION=${{ matrix.version }}
      cache-gha-scope: ubuntu-${{ matrix.version }}
      context: ubuntu
      image-name: home-assistant-base-ubuntu
      image-tags: |
        ${{ needs.init.outputs.release_suffix && format('{0}{1}', matrix.tag, needs.init.outputs.release_suffix) || '' }}
        ${{ matrix.tag }}
        ${{ matrix.latest && 'latest' || '' }}
      labels: |
        io.hass.base.image=ubuntu:${{ matrix.version }}
      push: ${{ needs.init.outputs.push == 'true' }}
      version: ${{ needs.init.outputs.version }}

  build_python:
    name: Python ${{ matrix.python_version }} (Alpine ${{ matrix.alpine_version }})
    needs: [init, build_alpine]
    # A failing dev build must not block the Python images of the stable releases.
    if: ${{ !cancelled() && needs.init.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.python_matrix) }}
    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write # For pushing to registry
    uses: ./.github/workflows/build-base-image.yml
    with:
      architectures: ${{ matrix.architectures }}
      cache-gha-scope: python-${{ matrix.python_version }}-alpine${{ matrix.alpine_version }}
      context: python/${{ matrix.python_version }}
      published-base: ghcr.io/${{ github.repository_owner }}/home-assistant-base:${{ matrix.alpine_tag }}${{ needs.init.outputs.release_suffix }}
      # Profile-guided and link-time optimization take hours under CPU emulation
      emulated-build-args: |
        PYTHON_OPTIMIZATIONS=
      image-name: home-assistant-base-python
      image-tags: |
        ${{ needs.init.outputs.release_suffix && format('{0}{1}', matrix.tag, needs.init.outputs.release_suffix) || '' }}
        ${{ matrix.tag }}
        ${{ matrix.latest && 'latest' || '' }}
      labels: |
        io.hass.base.image=ghcr.io/${{ github.repository_owner }}/home-assistant-base:${{ matrix.alpine_tag }}${{ needs.init.outputs.release_suffix }}
      local-alpine-version: ${{ needs.init.outputs.push != 'true' && matrix.alpine_version || '' }}
      push: ${{ needs.init.outputs.push == 'true' }}
      version: ${{ needs.init.outputs.version }}

  publish_release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' && needs.init.outputs.release_tag != ''
    needs: [init, build_alpine, build_debian, build_ubuntu, build_python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the matching upstream version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.init.outputs.release_tag }}
        run: |
          notes="Multi-architecture base images built from [home-assistant/docker-base ${RELEASE}](https://github.com/home-assistant/docker-base/releases/tag/${RELEASE}). Published image tags end in -${RELEASE}."
          state="$(gh release view "${RELEASE}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null)" || state=""
          case "${state}" in
            true)
              gh release edit "${RELEASE}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest --title "${RELEASE}" --notes "${notes}"
              ;;
            false)
              echo "Release ${RELEASE} already published"
              ;;
            *)
              gh release create "${RELEASE}" --repo "${GITHUB_REPOSITORY}" --verify-tag --latest --title "${RELEASE}" --notes "${notes}"
              ;;
          esac

  prune_legacy_tags:
    name: Remove retired GHCR versions
    if: ${{ !cancelled() && needs.init.outputs.release_tag != '' }}
    needs: [init, build_alpine, build_debian, build_ubuntu, build_python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove superseded tags
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RELEASE: ${{ needs.init.outputs.release_tag }}
        run: python3 -I scripts/prune_ghcr_tags.py
