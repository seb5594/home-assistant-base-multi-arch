name: Reusable workflow building a multi-arch image

# amd64 and aarch64 are built with the Home Assistant builder actions. They do not
# support the legacy 32-bit architectures any more, so armv7, armhf and i386 are built
# by the build-legacy job below. All per-architecture images are then merged into one
# multi-arch manifest.

on:
  workflow_call:
    inputs:
      architectures:
        description: Architectures to build (JSON array, e.g., '["amd64", "aarch64", "armv7", "armhf", "i386"]')
        required: true
        type: string
      build-args:
        description: Additional build arguments (key=value format, one per line)
        required: false
        default: ""
        type: string
      cache-gha:
        description: Whether to use GitHub Actions cache for build caching
        required: false
        default: true
        type: boolean
      cache-gha-scope:
        description: Scope for build cache sharing (defaults to architecture, set if building multiple images from a single repo)
        required: false
        default: ""
        type: string
      cache-image-tag:
        description: Tag of the image containing BuildKit inline cache metadata
        required: false
        default: "latest"
        type: string
      context:
        description: Build context path (usually the directory with Dockerfile)
        required: true
        type: string
      cosign:
        description: Whether to sign images with Cosign
        required: false
        default: true
        type: boolean
      cosign-base-identity:
        description: Certificate identity regexp for verifying the base (FROM) image
        required: false
        default: ""
        type: string
      cosign-base-issuer:
        description: Certificate OIDC issuer regexp for base image verification (defaults to cosign-issuer)
        required: false
        default: ""
        type: string
      cosign-base-verify:
        description: Base image reference to verify with cosign before building
        required: false
        default: ""
        type: string
      cosign-identity:
        description: Certificate identity regexp for verifying cache images (defaults to current repo pattern)
        required: false
        default: ""
        type: string
      cosign-issuer:
        description: Certificate OIDC issuer regexp for all cosign verification
        required: false
        default: "https://token.actions.githubusercontent.com"
        type: string
      emulated-build-args:
        description: Additional build arguments (key=value format, one per line) for architectures that are built under CPU emulation (armv7, armhf)
        required: false
        default: ""
        type: string
      file:
        description: Dockerfile path (defaults to "Dockerfile" in the context directory)
        required: false
        default: ""
        type: string
      image-name:
        description: Image name without a tag (e.g., "base-python")
        required: true
        type: string
      image-tags:
        description: Image tags, one per line
        required: true
        type: string
      labels:
        description: Additional OCI labels (key=value format, one per line)
        required: false
        default: ""
        type: string
      push:
        description: Whether to push images to registry
        required: false
        default: false
        type: boolean
      version:
        description: Image version label
        required: true
        type: string

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      has-legacy: ${{ steps.split.outputs.has-legacy }}
      has-native: ${{ steps.split.outputs.has-native }}
      legacy-matrix: ${{ steps.split.outputs.legacy-matrix }}
      native-architectures: ${{ steps.split.outputs.native-architectures }}
      native-matrix: ${{ steps.native.outputs.matrix }}
    steps:
      - name: Split architectures
        id: split
        shell: bash
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          IMAGE_NAME: ${{ inputs.image-name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          unknown="$(jq -r '.[] | select(IN("amd64", "aarch64", "armv7", "armhf", "i386") | not)' <<< "${ARCHITECTURES}")"
          if [[ -n "${unknown}" ]]; then
            echo "::error::Unsupported architectures: ${unknown}"
            exit 1
          fi

          native="$(jq -c '[.[] | select(. == "amd64" or . == "aarch64")]' <<< "${ARCHITECTURES}")"

          # The 32-bit variants run on an amd64 runner. i386 executes natively there,
          # the ARM variants need QEMU.
          legacy="$(jq -c \
            --arg prefix "ghcr.io/${OWNER,,}" \
            --arg name "${IMAGE_NAME}" '
              {
                armv7: {platform: "linux/arm/v7", emulated: true},
                armhf: {platform: "linux/arm/v6", emulated: true},
                i386: {platform: "linux/386", emulated: false}
              } as $platforms
              | {include: [
                  .[]
                  | select($platforms[.] != null)
                  | {arch: ., image: "\($prefix)/\(.)-\($name)"} + $platforms[.]
                ]}
            ' <<< "${ARCHITECTURES}")"

          {
            echo "native-architectures=${native}"
            echo "has-native=$(jq 'length > 0' <<< "${native}")"
            echo "legacy-matrix=${legacy}"
            echo "has-legacy=$(jq '.include | length > 0' <<< "${legacy}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare matrix for amd64 and aarch64
        id: native
        if: steps.split.outputs.has-native == 'true'
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.split.outputs.native-architectures }}
          image-name: ${{ inputs.image-name }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    if: needs.prepare.outputs.has-native == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.native-matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        id: build
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          build-args: ${{ inputs.build-args }}
          cache-gha: ${{ inputs.cache-gha }}
          cache-gha-scope: ${{ inputs.cache-gha-scope }}
          cache-image-tag: ${{ inputs.cache-image-tag }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ inputs.context }}
          cosign: ${{ inputs.cosign }}
          cosign-base-identity: ${{ inputs.cosign-base-identity }}
          cosign-base-issuer: ${{ inputs.cosign-base-issuer }}
          cosign-base-verify: ${{ inputs.cosign-base-verify }}
          cosign-identity: ${{ inputs.cosign-identity }}
          cosign-issuer: ${{ inputs.cosign-issuer }}
          file: ${{ inputs.file }}
          image: ${{ matrix.image }}
          image-tags: ${{ inputs.image-tags }}
          labels: |
            io.hass.base.arch=${{ matrix.arch }}
            io.hass.base.version=${{ inputs.version }}
            ${{ inputs.labels }}
          push: ${{ inputs.push }}
          version: ${{ inputs.version }}

  build-legacy:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    if: needs.prepare.outputs.has-legacy == 'true'
    runs-on: ubuntu-24.04
    # Compiling under QEMU is slow, give it the maximum a hosted runner allows.
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.legacy-matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.emulated
        uses: docker/setup-qemu-action@v4 # Renovate pins the digest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Renovate pins the digest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4 # Renovate pins the digest
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: inputs.cosign || inputs.cosign-base-verify != ''
        uses: sigstore/cosign-installer@v4 # Renovate pins the digest

      - name: Verify base image signature
        if: inputs.cosign-base-verify != ''
        shell: bash
        env:
          BASE_IMAGE: ${{ inputs.cosign-base-verify }}
          IDENTITY: ${{ inputs.cosign-base-identity }}
          ISSUER: ${{ inputs.cosign-base-issuer || inputs.cosign-issuer }}
        run: |
          cosign verify \
            --certificate-identity-regexp "${IDENTITY}" \
            --certificate-oidc-issuer-regexp "${ISSUER}" \
            "${BASE_IMAGE}" > /dev/null

      - name: Compute image tags
        id: options
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAGS: ${{ inputs.image-tags }}
        run: |
          {
            echo "tags<<EOF"
            while read -r tag; do
              if [[ -n "${tag}" ]]; then
                echo "${IMAGE}:${tag}"
              fi
            done <<< "${IMAGE_TAGS}"
            echo "EOF"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        id: build
        uses: docker/build-push-action@v6 # Renovate pins the digest
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ matrix.platform }}
          pull: true
          # Attestations would turn the per-architecture tag into an index and
          # complicate merging the images into the multi-arch manifest.
          provenance: false
          sbom: false
          tags: ${{ steps.options.outputs.tags }}
          outputs: type=image,push=${{ inputs.push }},compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true
          cache-from: ${{ inputs.cache-gha && format('type=gha,scope={0}-{1}', matrix.arch, inputs.cache-gha-scope) || '' }}
          cache-to: ${{ inputs.cache-gha && format('type=gha,mode=max,scope={0}-{1}', matrix.arch, inputs.cache-gha-scope) || '' }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ inputs.version }}
            ${{ inputs.build-args }}
            ${{ matrix.emulated && inputs.emulated-build-args || '' }}
          labels: |
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ inputs.version }}
            io.hass.base.arch=${{ matrix.arch }}
            io.hass.base.version=${{ inputs.version }}
            org.opencontainers.image.created=${{ steps.options.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            ${{ inputs.labels }}

      - name: Sign image
        if: inputs.push && inputs.cosign
        shell: bash
        env:
          REFERENCE: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3 4 5; do
            if cosign sign --yes "${REFERENCE}"; then
              exit 0
            fi
            echo "Signing failed (attempt ${attempt}), retrying"
            sleep "$((2 ** attempt))"
          done
          exit 1

  manifest:
    name: Publish multi-arch manifest
    # The legacy architectures are best effort: a failed ARM build must not keep
    # amd64 and aarch64 from being published.
    if: ${{ !cancelled() && inputs.push && needs.prepare.result == 'success' && needs.build.result != 'failure' }}
    needs: [prepare, build, build-legacy]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4 # Renovate pins the digest
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select architectures with a published image
        id: available
        shell: bash
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAGS: ${{ inputs.image-tags }}
          OWNER: ${{ github.repository_owner }}
        run: |
          first_tag="$(grep -m1 -v '^[[:space:]]*$' <<< "${IMAGE_TAGS}" | xargs)"
          available=()
          for arch in $(jq -r '.[]' <<< "${ARCHITECTURES}"); do
            source="ghcr.io/${OWNER,,}/${arch}-${IMAGE_NAME}:${first_tag}"
            if docker buildx imagetools inspect "${source}" > /dev/null 2>&1; then
              available+=("${arch}")
            else
              echo "::warning::No ${arch} image for ${IMAGE_NAME}:${first_tag}, it is left out of the manifest"
            fi
          done
          echo "architectures=$(jq -cn '$ARGS.positional' --args "${available[@]}")" >> "${GITHUB_OUTPUT}"

      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.available.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign: ${{ inputs.cosign }}
          image-name: ${{ inputs.image-name }}
          image-tags: ${{ inputs.image-tags }}
