name: Reusable workflow building a multi-arch image

# Build native and legacy platforms on their original runners, then publish an OCI index.

on:
  workflow_call:
    inputs:
      architectures:
        description: Architectures to build (JSON array, e.g., '["amd64", "aarch64", "armv7", "armhf", "i386"]')
        required: true
        type: string
      build-args:
        description: Additional build arguments (key=value format, one per line)
        required: false
        default: ""
        type: string
      cache-gha:
        description: Whether to use GitHub Actions cache for build caching
        required: false
        default: true
        type: boolean
      cache-gha-scope:
        description: Scope for build cache sharing (defaults to architecture, set if building multiple images from a single repo)
        required: false
        default: ""
        type: string
      context:
        description: Build context path (usually the directory with Dockerfile)
        required: true
        type: string
      emulated-build-args:
        description: Additional build arguments (key=value format, one per line) for architectures that are built under CPU emulation (armv7, armhf)
        required: false
        default: ""
        type: string
      file:
        description: Dockerfile path (defaults to "Dockerfile" in the context directory)
        required: false
        default: ""
        type: string
      image-name:
        description: Image name without a tag (e.g., "base-python")
        required: true
        type: string
      image-tags:
        description: Image tags, one per line, with the monthly tag first
        required: true
        type: string
      labels:
        description: Additional OCI labels (key=value format, one per line)
        required: false
        default: ""
        type: string
      local-alpine-version:
        description: Build Python using the Alpine Dockerfile from this checkout for CI runs without publishing
        required: false
        default: ""
        type: string
      published-base:
        description: Registry reference for the Alpine base published by this run
        required: false
        default: ""
        type: string
      push:
        description: Whether to push images to registry
        required: false
        default: false
        type: boolean
      version:
        description: Image version label
        required: true
        type: string

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Map architectures to runners and platforms
        id: matrix
        shell: bash
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          IMAGE_NAME: ${{ inputs.image-name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          matrix="$(jq -ce --arg prefix "ghcr.io/${OWNER,,}" --arg name "${IMAGE_NAME}" '
            {
              amd64:   {platform: "linux/amd64",  os: "ubuntu-24.04",     emulated: false},
              aarch64: {platform: "linux/arm64",  os: "ubuntu-24.04-arm", emulated: false},
              armv7:   {platform: "linux/arm/v7", os: "ubuntu-24.04",     emulated: true},
              armhf:   {platform: "linux/arm/v6", os: "ubuntu-24.04",     emulated: true},
              i386:    {platform: "linux/386",    os: "ubuntu-24.04",     emulated: false}
            } as $targets
            | {include: [
                .[] as $arch
                | ($targets[$arch] // error("Unsupported architecture: " + $arch))
                + {arch: $arch, image: "\($prefix)/\($arch)-\($name)"}
              ]}
          ' <<< "${ARCHITECTURES}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      attestations: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.emulated
        uses: docker/setup-qemu-action@v4

      - name: Build Python from the checked-out Alpine base
        if: inputs.local-alpine-version != ''
        uses: ./.github/actions/build-python-local
        with:
          alpine-version: ${{ inputs.local-alpine-version }}
          context: ${{ inputs.context }}
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          version: ${{ inputs.version }}
          cache-scope: ${{ inputs.cache-gha && format('{0}-ci-{1}', matrix.arch, inputs.cache-gha-scope) || '' }}
          emulated: ${{ matrix.emulated }}

      - name: Set up Docker Buildx
        if: inputs.local-alpine-version == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the Alpine base from this run
        if: inputs.push && inputs.published-base != ''
        id: base
        shell: bash
        env:
          BASE_IMAGE: ${{ inputs.published-base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          descriptor="$(docker buildx imagetools inspect "${BASE_IMAGE}" --format '{{json .Manifest}}')"
          if ! jq -e --arg run "${GITHUB_RUN_ID}" '.annotations["io.hass.build.run"] == $run' <<< "${descriptor}" > /dev/null; then
            echo "::error::${BASE_IMAGE} was not published by run ${GITHUB_RUN_ID}"
            exit 1
          fi
          reference="${BASE_IMAGE%:*}@$(jq -er '.digest' <<< "${descriptor}")"
          verified=false
          for delay in 0 2 4 8; do
            sleep "${delay}"
            if gh attestation verify "oci://${reference}" --repo "${GITHUB_REPOSITORY}"; then
              verified=true
              break
            fi
          done
          [[ "${verified}" == true ]]
          echo "build-arg=BUILD_FROM=${reference}" >> "${GITHUB_OUTPUT}"

      - name: Compute image tags
        if: inputs.local-alpine-version == ''
        id: options
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_TAGS: ${{ inputs.image-tags }}
        run: |
          {
            echo "tags<<EOF"
            while IFS= read -r tag; do
              if [[ -n "${tag}" ]]; then
                echo "${IMAGE}:${tag}"
              fi
            done <<< "${IMAGE_TAGS}"
            echo "EOF"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        if: inputs.local-alpine-version == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: false
          sbom: false
          tags: ${{ steps.options.outputs.tags }}
          outputs: ${{ inputs.push && 'type=image,push=true,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true' || 'type=cacheonly' }}
          cache-from: ${{ inputs.cache-gha && format('type=gha,scope={0}-{1}', matrix.arch, inputs.cache-gha-scope) || '' }}
          cache-to: ${{ inputs.cache-gha && format('type=gha,mode=max,scope={0}-{1}', matrix.arch, inputs.cache-gha-scope) || '' }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ inputs.version }}
            ${{ inputs.build-args }}
            ${{ matrix.emulated && inputs.emulated-build-args || '' }}
            ${{ steps.base.outputs.build-arg }}
          labels: |
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ inputs.version }}
            io.hass.base.arch=${{ matrix.arch }}
            io.hass.base.version=${{ inputs.version }}
            io.hass.build.run=${{ github.run_id }}
            org.opencontainers.image.created=${{ steps.options.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            ${{ inputs.labels }}

  manifest:
    name: Publish multi-arch manifest
    if: ${{ !cancelled() && inputs.push && needs.prepare.result == 'success' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest from this run's images
        id: publish
        shell: bash
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAGS: ${{ inputs.image-tags }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          mapfile -t tags < <(grep -v '^[[:space:]]*$' <<< "${IMAGE_TAGS}")
          sources=()
          for arch in $(jq -r '.[]' <<< "${ARCHITECTURES}"); do
            repo="ghcr.io/${OWNER,,}/${arch}-${IMAGE_NAME}"
            source="${repo}:${tags[0]}"
            # The monthly tag can still point at an earlier run if this build failed.
            if descriptor="$(docker buildx imagetools inspect "${source}" --format '{{json .Manifest}}')" &&
               digest="$(jq -er '.digest' <<< "${descriptor}")" &&
               config="$(docker buildx imagetools inspect "${repo}@${digest}" --format '{{json .Image}}')" &&
               jq -e --arg run "${GITHUB_RUN_ID}" '.config.Labels["io.hass.build.run"] == $run' <<< "${config}" > /dev/null; then
              sources+=("${repo}@${digest}")
            elif [[ "${arch}" == amd64 || "${arch}" == aarch64 ]]; then
              echo "::error::Missing required ${arch} image from this run: ${source}"
              exit 1
            else
              echo "::warning::Missing ${arch} image from this run: ${source}"
            fi
          done
          if (( ${#sources[@]} == 0 )); then
            echo "::error::No images from this run are available for ${image}"
            exit 1
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "${image}:${tag}")
          done
          metadata="$(mktemp)"
          docker buildx imagetools create \
            --annotation "index:io.hass.build.run=${GITHUB_RUN_ID}" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --metadata-file "${metadata}" "${tag_args[@]}" "${sources[@]}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "digest=$(jq -er '."containerimage.descriptor".digest' "${metadata}")" >> "${GITHUB_OUTPUT}"

      - name: Attest the published manifest in GitHub Actions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: false
